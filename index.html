<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060c" />
    <title>Games</title>
    <link rel="icon" href="skaal/assets/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07060c;
        --text: #f7f3ea;
        --muted: #b4b0a9;
        --gold: #f7c04a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(60vmax 40vmax at 15% 10%, rgba(247, 192, 74, 0.16), transparent 60%),
          radial-gradient(50vmax 40vmax at 90% 90%, rgba(139, 92, 246, 0.16), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 440px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      a.game {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border-radius: 22px;
        color: inherit;
        text-decoration: none;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: transform 0.2s;
      }
      a.game:active {
        transform: scale(0.98);
      }
      a.game img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
      }
      a.game strong {
        display: block;
        font-size: 20px;
      }
      a.game span {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Games</h1>
      <a class="game" href="skaal/">
        <img src="skaal/assets/icons/icon-192.png" alt="" />
        <div>
          <strong>SKÅL</strong>
          <span>Live drikke-scoreboard med lykkehjul og minigames</span>
        </div>
      </a>
    </main>
  </body>
</html>
